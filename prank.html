<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff69b4, #ffb6d9);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        h1 {
            font-size: 70px;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            letter-spacing: 2px;
            animation: bounce 2s infinite;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .balloons {
            position: fixed;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            opacity: 0.8;
            animation: float 10s infinite ease-in;
        }

        .balloon1 {
            left: 10%;
            background-color: #ff1493;
            animation-delay: 0s;
        }

        .balloon2 {
            right: 10%;
            background-color: #ffc0cb;
            animation-delay: 1s;
        }

        .balloon3 {
            left: 50%;
            background-color: #ff69b4;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                bottom: -100px;
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                bottom: 100vh;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="balloons balloon1"></div>
    <div class="balloons balloon2"></div>
    <div class="balloons balloon3"></div>

    <div class="container">
        <h1>😂 Aapka Chutiya<br>Bnaya Gya 😂</h1>
    </div>
</body>
</html>
